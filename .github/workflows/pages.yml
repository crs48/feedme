name: Deploy Feedme site and directory
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'crs48/feedme'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Find the last trusted directory state
        id: previous-directory
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const repository = { owner: context.repo.owner, repo: context.repo.repo };
            const { data } = await github.rest.actions.listWorkflowRuns({ ...repository, workflow_id: 'pages.yml', branch: 'main', status: 'success', per_page: 20 });
            for (const run of data.workflow_runs) {
              if (!['push', 'schedule', 'workflow_dispatch'].includes(run.event) || run.head_repository?.full_name !== `${repository.owner}/${repository.repo}`) continue;
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({ ...repository, run_id: run.id });
              const artifact = artifacts.artifacts.find(a => a.name === 'feedme-directory-state' && !a.expired && a.size_in_bytes <= 16000000);
              if (artifact) { core.setOutput('run-id', String(run.id)); break; }
            }
      - name: Restore public collector state
        if: steps.previous-directory.outputs.run-id
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: feedme-directory-state
          path: output/directory-previous
          run-id: ${{ steps.previous-directory.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Collect public Feedme profiles
        run: pnpm directory:collect --previous output/directory-previous/state.json
      - run: pnpm build:site
        env:
          DIRECTORY_SNAPSHOT_PATH: output/directory/snapshot.json
      - name: Save public collector state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feedme-directory-state
          path: output/directory/state.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
